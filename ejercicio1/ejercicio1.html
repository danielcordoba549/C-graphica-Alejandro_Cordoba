<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="eje1.css">
</head>
<body>
    <main class="form-page">
        <section class="form-section">
            <div class="form-container">
                <header class="form-header">
                    <span class="eyebrow">REGISTRO</span>
                    <h1>Crea tu cuenta</h1>
                    <p>Completa los datos para registrarte en la plataforma.</p>
                </header>
                <form class="contact-form" action="#" method="post">
                    <div class="form-field">
                        <label for="nombre">Nombre <span class="required-mark">*</span></label>
                        <input type="text" id="nombre" name="nombre" autocomplete="name" placeholder="Tu nombre" required>
                    </div>
                    <div class="form-field">
                        <label for="email">Correo electrónico <span class="required-mark">*</span></label>
                        <input type="email" id="email" name="email" autocomplete="email" placeholder="correo@ejemplo.com" required>
                    </div>
                    <div class="form-field">
                        <label for="password">Contraseña <span class="required-mark">*</span></label>
                        <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
                        <small class="field-help">Mínimo 8 caracteres.</small>
                    </div>
                    <label class="choice">
                        <input type="checkbox" name="terminos" required>
                        <span>Acepto los términos y condiciones</span>
                    </label>
                    <div class="form-actions">
                        <button type="submit" class="button button-primary">Registrarse</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
