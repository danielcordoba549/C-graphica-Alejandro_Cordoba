<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="styles_1.css">
</head>
<body>

    <div class="form-container">
        <span class="tag-contacto">CONTACTO</span>
        <h1>Cuéntenos sobre su necesidad</h1>
        <p class="subtitle">Complete el formulario. Los campos marcados con * son obligatorios.</p>

        <form action="#" method="post">
            
            <!-- SECCIÓN 1: Datos personales -->
            <h3>Datos personales</h3>
            <div class="form-row">
                <div class="form-field">
                    <label for="nombre">Nombre <span class="required">*</span></label>
                    <input type="text" id="nombre" name="nombre" placeholder="Laura" required autocomplete="name">
                </div>
                <div class="form-field">
                    <label for="apellido">Apellido <span class="required">*</span></label>
                    <input type="text" id="apellido" name="apellido" placeholder="Gustin" required autocomplete="family-name">
                </div>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label for="correo">Correo <span class="required">*</span></label>
                    <input type="email" id="correo" name="correo" placeholder="nombre@empresa.com" required autocomplete="email">
                </div>
                <div class="form-field">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="+57 300 000 0000" autocomplete="tel">
                </div>

            <!-- SECCIÓN 2: Organización -->
            <h3>Organización</h3>
            <div class="form-row">
                <div class="form-field">
                    <label for="empresa">Empresa</label>
                    <input type="text" id="empresa" name="empresa">
                </div>
                <div class="form-field">
                    <label for="empleados">Número de empleados</label>
                    <input type="number" id="empleados" name="empleados" min="1">
                </div>
            </div>

            <div class="form-field">
                <label for="servicio">Servicio de interés <span class="required">*</span></label>
                <select id="servicio" name="servicio" required>
                    <option value="" disabled selected>Seleccione un servicio</option>
                    <option value="pentesting">Pentesting Web</option>
                    <option value="devsecops">DevSecOps</option>
                    <option value="ai-security">AI Security</option>
                </select>
            </div>

            <!-- SECCIÓN 3: Disponibilidad -->
            <h3>Disponibilidad</h3>
            <div class="form-row">
                <div class="form-field">
                    <label for="fecha">Fecha preferida</label>
                    <input type="date" id="fecha" name="fecha">
                </div>
                <div class="form-field">
                    <label for="hora">Hora preferida</label>
                    <input type="time" id="hora" name="hora">
                </div>
            </div>

            <!-- SECCIÓN 4: Opciones múltiples -->
            <div class="form-field">
                <fieldset>
                    <legend>Modalidad de contacto</legend>
                    <label><input type="radio" name="modalidad" value="correo" checked> Correo electrónico</label>
                    <label><input type="radio" name="modalidad" value="telefono"> Teléfono</label>
                    <label><input type="radio" name="modalidad" value="videollamada"> Videollamada</label>
                </fieldset>
            </div>

            <div class="form-field">
                <fieldset>
                    <legend>Temas adicionales de interés</legend>
                    <label><input type="checkbox" name="temas" value="seguridad_app"> Seguridad de aplicaciones</label>
                    <label><input type="checkbox" name="temas" value="cloud_security"> Cloud Security</label>
                    <label><input type="checkbox" name="temas" value="ai_security"> AI Security</label>
                </fieldset>
            </div>

            <!-- SECCIÓN 5: Área de texto y archivos -->
            <div class="form-field">
                <label for="necesidad">Describa su necesidad <span class="required">*</span></label>
                <textarea id="necesidad" name="necesidad" rows="5" maxlength="1200" placeholder="Cuéntenos brevemente qué necesita..." required></textarea>
                <small class="hint-text">Máximo 1200 caracteres.</small>
            </div>

            <div class="form-field file-upload">
                <label for="soporte">Documento de soporte</label>
                <input type="file" id="soporte" name="soporte" accept=".pdf, .doc, .docx, .xls, .xlsx">
                <small class="hint-text">Formatos sugeridos: PDF, Word o Excel.</small>
            </div>

            <!-- SECCIÓN 6: Términos y botones -->
            <div class="form-field terms">
                <label>
                    <input type="checkbox" name="terminos" required> Acepto el tratamiento de la información suministrada.
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Enviar solicitud</button>
                <button type="reset" class="btn-secondary">Limpiar</button>
            </div>

        </form>
    </div>

</body>
</html>
