<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="styles_1.css">
</head>
<body>

    <div class="form-container">
        <span class="tag-contacto">CONTACTO</span>
        <h1>Cuéntenos sobre su necesidad</h1>
        <p class="subtitle">Complete el formulario. Los campos marcados con * son obligatorios.</p>

        <form action="#" method="post">
            
            <!-- SECCIÓN 1: Datos personales -->
            <h3>Datos personales</h3>
            <div class="form-row">
                <div class="form-field">
                    <label for="nombre">Nombre <span class="required">*</span></label>
                    <input type="text" id="nombre" name="nombre" placeholder="Laura" required autocomplete="name">
                </div>
                <div class="form-field">
                    <label for="apellido">Apellido <span class="required">*</span></label>
                    <input type="text" id="apellido" name="apellido" placeholder="Gustin" required autocomplete="family-name">
                </div>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label for="correo">Correo <span class="required">*</span></label>
                    <input type="email" id="correo" name="correo" placeholder="nombre@empresa.com" required autocomplete="email">
                </div>
                <div class="form-field">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="+57 300 000 0000" autocomplete="tel">
                </div>
            </div>
        </form>
    </div>    
</body>
