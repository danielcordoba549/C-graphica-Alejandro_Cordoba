<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Soporte Técnico</title>
    <link rel="stylesheet" href="eje5.css">
</head>
<body>
    <main class="form-page">
        <section class="form-section">
            <div class="form-container">
                <header class="form-header">
                    <span class="eyebrow">SOPORTE</span>
                    <h1>Centro de Ayuda</h1>
                    <p>Reporta un incidente técnico detallando la prioridad y descripción.</p>
                </header>
                <form class="contact-form" action="#" method="post">
                    <div class="form-field">
                        <label for="prioridad">Prioridad del incidente <span class="required-mark">*</span></label>
                        <select id="prioridad" name="prioridad" required>
                            <option value="" disabled selected>Seleccione prioridad</option>
                            <option value="baja">Baja</option>
                            <option value="media">Media</option>
                            <option value="alta">Alta</option>
                            <option value="critica">Crítica</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="descripcion">Descripción del problema <span class="required-mark">*</span></label>
                        <textarea id="descripcion" name="descripcion" rows="5" placeholder="Explique detalladamente qué ocurre..." required></textarea>
                    </div>
                    <div class="form-field">
                        <label for="captura">Captura o archivo de evidencia</label>
                        <input type="file" id="captura" name="captura" accept="image/*,.pdf">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="button button-primary">Crear Ticket</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
