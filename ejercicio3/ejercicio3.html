<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Satisfacción</title>
    <link rel="stylesheet" href="eje3.css">
</head>
<body>
    <main class="form-page">
        <section class="form-section">
            <div class="form-container">
                <header class="form-header">
                    <span class="eyebrow">FEEDBACK</span>
                    <h1>Encuesta de Satisfacción</h1>
                    <p>Tu opinión es importante para mejorar nuestros servicios.</p>
                </header>
                <form class="contact-form" action="#" method="post">
                    <fieldset>
                        <legend>¿Cómo calificarías la atención recibida?</legend>
                        <div class="choice-list">
                            <label class="choice"><input type="radio" name="atencion" value="excelente" checked> <span>Excelente</span></label>
                            <label class="choice"><input type="radio" name="atencion" value="buena"> <span>Buena</span></label>
                            <label class="choice"><input type="radio" name="atencion" value="regular"> <span>Regular</span></label>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>¿Qué servicios utilizas habitualmente?</legend>
                        <div class="choice-list">
                            <label class="choice"><input type="checkbox" name="servicios" value="web"> <span>Desarrollo Web</span></label>
                            <label class="choice"><input type="checkbox" name="servicios" value="movil"> <span>Apps Móviles</span></label>
                            <label class="choice"><input type="checkbox" name="servicios" value="cloud"> <span>Cloud Computing</span></label>
                        </div>
                    </fieldset>
                    <div class="form-field">
                        <label for="nivel">Nivel de recomendación (1 al 10)</label>
                        <input type="range" id="nivel" name="nivel" min="1" max="10" value="8">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="button button-primary">Enviar Encuesta</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
